# CI (PLAN M9.8): every push and pull request runs the same checks as `scripts/ai/verify.sh`, the
# Playwright golden path, and builds the production images (not pushed). The infrastructure is the
# dev docker-compose.yml (Postgres, the S3 server, Mailpit), started with `pnpm db:up` as locally;
# .env.example's development values are enough for tests.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, typecheck, tests, generated files
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version from package.json's packageManager
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cp .env.example .env
      - run: pnpm db:up
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Generated files are committed
        run: |
          pnpm schema:print
          pnpm codegen
          git diff --exit-code -- apps/api/schema.graphql 'apps/dashboard/src/graphql/*.generated.ts'

  e2e:
    name: Playwright golden path
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cp .env.example .env
      - run: pnpm db:up
      - run: pnpm --filter @commerce/e2e exec playwright install --with-deps chromium
      - run: pnpm e2e
        env:
          CI: "true"
      - name: Upload the report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

  docker:
    name: Production images build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target api -t commerce-api .
      - run: docker build --target web -t commerce-web .

# Continuous deployment (PLAN M12): every push to main whose CI run succeeds is released to
# production (admin.dino-craft.lol), with no approval step (owner, 2026-11-14). "Run workflow" with
# a commit of main redeploys it, e.g. to roll back.
#
# The images are built for arm64 natively on GitHub's Arm runner, uploaded to the artifacts bucket,
# and scripts/deploy/release.sh releases them on the server through Session Manager. GitHub signs in
# to AWS through OIDC: the Deploy role (infra/aws) trusts only this repository's main branch and may
# only upload images and run that command. Settings are repository variables (not secrets):
# AWS_DEPLOY_ROLE_ARN, DEPLOY_INSTANCE_ID, ARTIFACTS_BUCKET, BACKUP_BUCKET (docs/deploy.md).
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      commit:
        description: Commit of main to deploy (full or short sha)
        required: true

# One release at a time, and never cancelled halfway through.
concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # the OIDC token for AWS

jobs:
  deploy:
    name: Release to production
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      AWS_REGION: ap-northeast-2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit || github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Resolve the commit (it must be on main)
        id: commit
        run: |
          sha="$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$sha" origin/main
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Deploying $sha: $(git log -1 --format=%s)"

      - name: Build the images (arm64)
        run: |
          docker build --target api -t commerce-api .
          docker build --target web -t commerce-web .

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload the images
        run: |
          docker save commerce-api commerce-web | gzip -1 \
            | aws s3 cp - "s3://${{ vars.ARTIFACTS_BUCKET }}/images/${{ steps.commit.outputs.sha }}.tar.gz" --only-show-errors

      - name: Release on the server
        env:
          SHA: ${{ steps.commit.outputs.sha }}
          INSTANCE: ${{ vars.DEPLOY_INSTANCE_ID }}
        run: |
          script="cd /home/ubuntu/commerce && sudo -u ubuntu git fetch -q origin && sudo -u ubuntu git checkout -q --detach $SHA && bash scripts/deploy/release.sh $SHA ${{ vars.ARTIFACTS_BUCKET }} ${{ vars.BACKUP_BUCKET }}"
          id="$(aws ssm send-command --instance-ids "$INSTANCE" --document-name AWS-RunShellScript \
            --comment "deploy $SHA" --timeout-seconds 1200 \
            --parameters "$(jq -n --arg s "$script" '{commands: [$s], executionTimeout: ["1200"]}')" \
            --query Command.CommandId --output text)"
          echo "Session Manager command $id"
          status=Pending
          for _ in $(seq 1 240); do
            sleep 5
            status="$(aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE" \
              --query Status --output text 2>/dev/null || echo Pending)"
            case "$status" in Success|Failed|Cancelled|TimedOut) break ;; esac
          done
          aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text || true
          echo "Release: $status"
          [ "$status" = Success ]

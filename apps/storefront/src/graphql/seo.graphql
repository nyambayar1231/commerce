# Documents for the sitemap and for category/collection meta descriptions (ARCHITECTURE §10.14).
# Minimal fields only: the sitemap needs slugs and, where the API has one, `updatedAt`.

query SitemapProducts($first: Int!, $after: String) {
  products(first: $first, after: $after) {
    edges {
      node {
        slug
        updatedAt
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}


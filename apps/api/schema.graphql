"""Represents errors in account mutations."""
type AccountError {
  code: AccountErrorCode!

  """
  Name of a field that caused the error. `null` if it isn't tied to one field.
  """
  field: String

  """The error message."""
  message: String!
}

enum AccountErrorCode {
  INACTIVE
  INVALID
  INVALID_CREDENTIALS
  OUT_OF_SCOPE_GROUP
  REQUIRED
  UNIQUE
}

"""
Represents a single category of products. Categories allow to organize products in a tree-hierarchies which can be used for navigation in the storefront.
"""
type Category implements Node {
  """List of children of the category."""
  children(after: String, before: String, first: Int, last: Int): CategoryCountableConnection

  """
  Description of the category.
  
  Rich text format. For reference see https://editorjs.io/
  """
  description: JSONString

  """The ID of the category."""
  id: ID!

  """Level of the category."""
  level: Int!

  """Name of category"""
  name: String!

  """Parent category."""
  parent: Category

  """Slug of the category."""
  slug: String!

  """The date and time when the category was last updated."""
  updatedAt: DateTime!
}

"""
Deletes categories.

Requires one of the following permissions: MANAGE_PRODUCTS.
"""
type CategoryBulkDelete {
  """Returns how many objects were affected."""
  count: Int!
  errors: [ProductError!]!
}

type CategoryCountableConnection {
  edges: [CategoryCountableEdge!]!
  pageInfo: PageInfo!

  """A total count of items in the collection."""
  totalCount: Int
}

type CategoryCountableEdge {
  cursor: String!
  node: Category!
}

"""
Creates a new category.

Requires one of the following permissions: MANAGE_PRODUCTS.
"""
type CategoryCreate {
  category: Category
  errors: [ProductError!]!
}

"""
Deletes a category.

Requires one of the following permissions: MANAGE_PRODUCTS.
"""
type CategoryDelete {
  category: Category
  errors: [ProductError!]!
}

input CategoryFilterInput {
  search: String
}

input CategoryInput {
  """
  Category description.
  
  Rich text format. For reference see https://editorjs.io/
  """
  description: JSONString

  """Category name."""
  name: String

  """Category slug."""
  slug: String
}

enum CategorySortField {
  """Sort categories by name."""
  NAME

  """Sort categories by subcategory count."""
  SUBCATEGORY_COUNT
}

input CategorySortingInput {
  """Specifies the direction in which to sort categories."""
  direction: OrderDirection!

  """Sort categories by the selected field."""
  field: CategorySortField!
}

"""
Updates a category.

Requires one of the following permissions: MANAGE_PRODUCTS.
"""
type CategoryUpdate {
  category: Category
  errors: [ProductError!]!
}

"""
Log in: on success, sets the HttpOnly session cookie and returns the user.
"""
type CreateToken {
  errors: [AccountError!]!
  user: User
}

"""
The `DateTime` scalar type represents a DateTime
value as specified by
[iso8601](https://en.wikipedia.org/wiki/ISO_8601).
"""
scalar DateTime

"""Represents permission group data."""
type Group implements Node {
  """The ID of the object."""
  id: ID!
  name: String!

  """List of group permissions"""
  permissions: [Permission!]

  """List of group users"""
  users: [User!]
}

scalar JSONString

"""Log out: ends the current session and clears the cookie."""
type Logout {
  errors: [AccountError!]!
}

"""Represents amount of money in specific currency."""
type Money {
  """Amount of money."""
  amount: Float!

  """Currency code."""
  currency: String!
}

type Mutation {
  """
  Deletes categories.
  
  Requires one of the following permissions: MANAGE_PRODUCTS.
  """
  categoryBulkDelete(
    """List of category IDs to delete."""
    ids: [ID!]!
  ): CategoryBulkDelete

  """
  Creates a new category.
  
  Requires one of the following permissions: MANAGE_PRODUCTS.
  """
  categoryCreate(
    """Fields required to create a category."""
    input: CategoryInput!

    """
    ID of the parent category. If empty, category will be top level category.
    """
    parent: ID
  ): CategoryCreate!

  """
  Deletes a category.
  
  Requires one of the following permissions: MANAGE_PRODUCTS.
  """
  categoryDelete(
    """ID of a category to delete."""
    id: ID!
  ): CategoryDelete!

  """
  Updates a category.
  
  Requires one of the following permissions: MANAGE_PRODUCTS.
  """
  categoryUpdate(
    """ID of a category to update."""
    id: ID!

    """Fields required to update a category."""
    input: CategoryInput!
  ): CategoryUpdate!

  """End the current session. Succeeds when there is none."""
  logout: Logout!

  """
  Create new permission group. Requires one of the following permissions: MANAGE_STAFF.
  """
  permissionGroupCreate(
    """Input fields to create permission group."""
    input: PermissionGroupCreateInput!
  ): PermissionGroupCreate!

  """
  Update permission group. Requires one of the following permissions: MANAGE_STAFF.
  """
  permissionGroupUpdate(
    """ID of the group to update."""
    id: ID!

    """Input fields to create permission group."""
    input: PermissionGroupUpdateInput!
  ): PermissionGroupUpdate!

  """
  Creates a new staff user. Requires one of the following permissions: MANAGE_STAFF.
  """
  staffCreate(
    """Fields required to create a staff user."""
    input: StaffCreateInput!
  ): StaffCreate!

  """Log in with email and password."""
  tokenCreate(
    """Email of a user."""
    email: String!

    """Password of a user."""
    password: String!
  ): CreateToken!
}

interface Node {
  """The ID of the object."""
  id: ID!
}

enum OrderDirection {
  """Specifies an ascending sort order."""
  ASC

  """Specifies a descending sort order."""
  DESC
}

type PageInfo {
  endCursor: String
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
}

"""Represents a permission object in a friendly form."""
type Permission {
  """Internal code for permission."""
  code: PermissionEnum!

  """Describe action(s) allowed to do by permission."""
  name: String!
}

enum PermissionEnum {
  MANAGE_CHECKOUTS
  MANAGE_ORDERS
  MANAGE_PRODUCTS
  MANAGE_SETTINGS
  MANAGE_SHIPPING
  MANAGE_STAFF
  MANAGE_USERS
}

"""
Create new permission group. Requires one of the following permissions: MANAGE_STAFF.
"""
type PermissionGroupCreate {
  errors: [PermissionGroupError!]!
  group: Group
}

input PermissionGroupCreateInput {
  """List of permission code names to assign to this group."""
  addPermissions: [PermissionEnum!]

  """List of users to assign to this group."""
  addUsers: [ID!]

  """Group name."""
  name: String!
}

type PermissionGroupError {
  """The error code."""
  code: PermissionGroupErrorCode!

  """
  Name of a field that caused the error. `null` if it isn't tied to one field.
  """
  field: String

  """The error message."""
  message: String!

  """List of permissions which causes the error."""
  permissions: [PermissionEnum!]

  """List of user IDs which causes the error."""
  users: [ID!]
}

enum PermissionGroupErrorCode {
  ASSIGN_NON_STAFF_MEMBER
  CANNOT_REMOVE_FROM_LAST_GROUP
  DUPLICATED_INPUT_ITEM
  OUT_OF_SCOPE_PERMISSION
  OUT_OF_SCOPE_USER
  REQUIRED
  UNIQUE
}

"""
Update permission group. Requires one of the following permissions: MANAGE_STAFF.
"""
type PermissionGroupUpdate {
  errors: [PermissionGroupError!]!
  group: Group
}

input PermissionGroupUpdateInput {
  """List of permission code names to assign to this group."""
  addPermissions: [PermissionEnum!]

  """List of users to assign to this group."""
  addUsers: [ID!]

  """Group name."""
  name: String

  """List of permission code names to unassign from this group."""
  removePermissions: [PermissionEnum!]

  """List of users to unassign from this group."""
  removeUsers: [ID!]
}

"""Represents an individual item for sale in the storefront."""
type Product implements Node {
  """Category of the product."""
  category: Category

  """The date and time when the product was created."""
  created: DateTime!

  """Default variant of the product."""
  defaultVariant: ProductVariant

  """
  Description of the product.
  
  Rich text format. For reference see https://editorjs.io/
  """
  description: JSONString

  """The ID of the product."""
  id: ID!

  """Indicates if the product is published."""
  isPublished: Boolean!

  """The minimal price of a product's variants."""
  minimalVariantPrice: Money

  """Name of the product."""
  name: String!

  """The product publication date time."""
  publishedAt: DateTime

  """Slug of the product."""
  slug: String!

  """The date and time when the product was last updated."""
  updatedAt: DateTime!

  """List of variants for the product."""
  variants: [ProductVariant!]!
}

type ProductCountableConnection {
  edges: [ProductCountableEdge!]!
  pageInfo: PageInfo!

  """A total count of items in the collection."""
  totalCount: Int
}

type ProductCountableEdge {
  cursor: String!
  node: Product!
}

"""Represents an error in the input of a mutation."""
type ProductError {
  """The error code."""
  code: ProductErrorCode!

  """
  Name of a field that caused the error. A value of `null` indicates that the error isn't associated with a particular field.
  """
  field: String

  """The error message."""
  message: String!
}

enum ProductErrorCode {
  GRAPHQL_ERROR
  INVALID
  NOT_FOUND
  REQUIRED
  UNIQUE
}

input ProductOrder {
  """Specifies the direction in which to sort products."""
  direction: OrderDirection!

  """Sort products by the selected field."""
  field: ProductOrderField
}

enum ProductOrderField {
  """Sort products by creation date."""
  CREATED_AT

  """Sort products by update date."""
  LAST_MODIFIED_AT

  """Sort products by name."""
  NAME

  """Sort products by price."""
  PRICE

  """Sort products by publication status."""
  PUBLISHED
}

"""Represents a version of a product such as different size or color."""
type ProductVariant implements Node {
  """The ID of the product variant."""
  id: ID!

  """The name of the product variant."""
  name: String!

  """The price of the product variant."""
  price: Money!

  """The product to which the variant belongs."""
  product: Product!

  """The SKU (stock keeping unit) of the product variant."""
  sku: String

  """
  Determines if the inventory of this variant should be tracked. If false, the quantity won't change when customers buy this item.
  """
  trackInventory: Boolean!
}

type Query {
  """List of the shop's categories."""
  categories(
    after: String
    before: String

    """Filtering options for categories."""
    filter: CategoryFilterInput
    first: Int
    last: Int

    """Filter categories by the nesting level in the category tree."""
    level: Int

    """Sort categories."""
    sortBy: CategorySortingInput
  ): CategoryCountableConnection

  """Look up a category by ID or slug."""
  category(
    """ID of the category."""
    id: ID

    """Slug of the category"""
    slug: String
  ): Category

  """Return the currently authenticated user."""
  me: User

  """
  Look up a product by ID or slug. Requires one of the following permissions to include the unpublished items: MANAGE_PRODUCTS.
  """
  product(
    """ID of the product."""
    id: ID

    """Slug of the product."""
    slug: String
  ): Product

  """
  List of the shop's products. Requires one of the following permissions to include the unpublished items: MANAGE_PRODUCTS.
  """
  products(
    after: String
    before: String
    first: Int
    last: Int

    """Search products."""
    search: String

    """Sort products."""
    sortBy: ProductOrder
  ): ProductCountableConnection

  """Return information about the shop."""
  shop: Shop!
}

"""
Represents a shop resource containing general shop data and configuration.
"""
type Shop {
  """The shop's single currency (ISO 4217). Saleor keeps this per channel."""
  currency: String!

  """Shop's name."""
  name: String!
}

"""
Creates a new staff user. Requires one of the following permissions: MANAGE_STAFF.
"""
type StaffCreate {
  errors: [StaffError!]!
  user: User
}

"""Fields required to create a staff user."""
input StaffCreateInput {
  """List of permission group IDs to which user should be assigned."""
  addGroups: [ID!]

  """The unique email address of the user."""
  email: String

  """Given name."""
  firstName: String

  """User account is active."""
  isActive: Boolean

  """Family name."""
  lastName: String
}

type StaffError {
  """The error code."""
  code: AccountErrorCode!

  """
  Name of a field that caused the error. `null` if it isn't tied to one field.
  """
  field: String

  """List of permission group IDs which cause the error."""
  groups: [ID!]

  """The error message."""
  message: String!

  """List of permission codes which causes the error."""
  permissions: [PermissionEnum!]

  """List of user IDs which causes the error."""
  users: [ID!]
}

"""Represents user data."""
type User implements Node {
  email: String!
  firstName: String!

  """The ID of the object."""
  id: ID!

  """Determine if the user is a staff admin."""
  isStaff: Boolean!
  lastName: String!

  """List of user's permissions."""
  userPermissions: [UserPermission!]
}

"""Represents user's permissions."""
type UserPermission {
  """Internal code for permission."""
  code: PermissionEnum!

  """Describe action(s) allowed to do by permission."""
  name: String!
}

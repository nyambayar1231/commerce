"""
Represents a single category of products. Categories allow to organize products in a tree-hierarchies which can be used for navigation in the storefront.
"""
type Category implements Node {
  """List of children of the category."""
  children(after: String, before: String, first: Int, last: Int): CategoryCountableConnection

  """
  Description of the category.
  
  Rich text format. For reference see https://editorjs.io/
  """
  description: JSONString

  """The ID of the category."""
  id: ID!

  """Level of the category."""
  level: Int!

  """Name of category"""
  name: String!

  """Parent category."""
  parent: Category

  """
  List of products in the category. Requires one of the following permissions to include the unpublished items: MANAGE_PRODUCTS.
  """
  products(
    after: String
    before: String
    first: Int
    last: Int

    """Search products."""
    search: String
  ): ProductCountableConnection

  """Slug of the category."""
  slug: String!

  """The date and time when the category was last updated."""
  updatedAt: DateTime!
}

"""
Deletes categories.

Requires one of the following permissions: MANAGE_PRODUCTS.
"""
type CategoryBulkDelete {
  """Returns how many objects were affected."""
  count: Int!
  errors: [ProductError!]!
}

type CategoryCountableConnection {
  edges: [CategoryCountableEdge!]!
  pageInfo: PageInfo!

  """A total count of items in the collection."""
  totalCount: Int
}

type CategoryCountableEdge {
  cursor: String!
  node: Category!
}

"""
Creates a new category.

Requires one of the following permissions: MANAGE_PRODUCTS.
"""
type CategoryCreate {
  category: Category
  errors: [ProductError!]!
}

"""
Deletes a category.

Requires one of the following permissions: MANAGE_PRODUCTS.
"""
type CategoryDelete {
  category: Category
  errors: [ProductError!]!
}

input CategoryFilterInput {
  ids: [ID!]
  search: String
}

input CategoryInput {
  """
  Category description.
  
  Rich text format. For reference see https://editorjs.io/
  """
  description: JSONString

  """Category name."""
  name: String

  """Category slug."""
  slug: String
}

enum CategorySortField {
  """Sort categories by name."""
  NAME

  """Sort categories by product count."""
  PRODUCT_COUNT

  """Sort categories by subcategory count."""
  SUBCATEGORY_COUNT
}

input CategorySortingInput {
  """Specifies the direction in which to sort categories."""
  direction: OrderDirection!

  """Sort categories by the selected field."""
  field: CategorySortField!
}

"""
Updates a category.

Requires one of the following permissions: MANAGE_PRODUCTS.
"""
type CategoryUpdate {
  category: Category
  errors: [ProductError!]!
}

type Checkout implements Node {
  """
  The authorize status of the checkout: whether the transactions cover the checkout total.
  """
  authorizeStatus: CheckoutAuthorizeStatusEnum!

  """The billing address of the checkout."""
  billingAddress: Address

  """
  The charge status of the checkout: how much of the total has been charged.
  """
  chargeStatus: CheckoutChargeStatusEnum!

  """The date and time when the checkout was created."""
  created: DateTime!

  """The delivery method selected for this checkout."""
  delivery: Delivery

  """Email of a customer."""
  email: String

  """The ID of the checkout."""
  id: ID!

  """Returns True, if checkout requires shipping."""
  isShippingRequired: Boolean!

  """
  A list of checkout lines, each containing information about an item in the checkout.
  """
  lines: [CheckoutLine!]!

  """The number of items purchased."""
  quantity: Int!

  """The shipping address of the checkout."""
  shippingAddress: Address

  """Shipping methods that can be used with this checkout."""
  shippingMethods: [ShippingMethod!]!

  """The price of the shipping, with all the taxes included."""
  shippingPrice: TaxedMoney!

  """The price of the checkout before shipping, with taxes included."""
  subtotalPrice: TaxedMoney!

  """The checkout's token."""
  token: UUID!

  """The difference between the paid and the checkout total amount."""
  totalBalance: Money!

  """
  The sum of the checkout line prices, with all the taxes, shipping costs, and discounts included.
  """
  totalPrice: TaxedMoney!

  """List of transactions for the checkout."""
  transactions: [TransactionItem!]

  """Time of last modification of the given checkout."""
  updatedAt: DateTime!

type Logout {
  errors: [AccountError!]!
}

"""Represents amount of money in specific currency."""
type Money {
  """Amount of money."""
  amount: Float!

  """Currency code."""
  currency: String!
}

type Mutation {
  """
  Register a new user. The answer is the same whether or not the email is already registered; log in with tokenCreate afterwards.
  """
  accountRegister(
    """Fields required to create a user."""
    input: AccountRegisterInput!
  ): AccountRegister!

  """
  Deletes categories.
  
  Requires one of the following permissions: MANAGE_PRODUCTS.
  """
  categoryBulkDelete(
    """List of category IDs to delete."""
    ids: [ID!]!
  ): CategoryBulkDelete

  """
  Creates a new category.
  
  Requires one of the following permissions: MANAGE_PRODUCTS.
  """
  categoryCreate(
    """Fields required to create a category."""
    input: CategoryInput!

    """
    ID of the parent category. If empty, category will be top level category.
    """
    parent: ID
  ): CategoryCreate!

  """
  Deletes a category.
  
  Requires one of the following permissions: MANAGE_PRODUCTS.
  """
  categoryDelete(
    """ID of a category to delete."""
    id: ID!
  ): CategoryDelete!

  """
  Updates a category.
  
  Requires one of the following permissions: MANAGE_PRODUCTS.
  """
  categoryUpdate(
    """ID of a category to update."""
    id: ID!

    """Fields required to update a category."""
    input: CategoryInput!
  ): CategoryUpdate!

  """Update billing address in the existing checkout."""
  checkoutBillingAddressUpdate(
    """The billing address of the checkout."""
    billingAddress: AddressInput!

    """The checkout's ID."""
    id: ID!
  ): CheckoutBillingAddressUpdate

  """
  Completes the checkout. As a result a new order is created. The checkout must be fully covered by its transactions (`authorizeStatus` FULL). Completing an already completed checkout returns its order.
  """
  checkoutComplete(
    """The checkout's ID."""
    id: ID!
  ): CheckoutComplete

  """Creates a new checkout."""
  checkoutCreate(
    """Fields required to create checkout."""
    input: CheckoutCreateInput!
  ): CheckoutCreate

  """
  Sets the customer as the owner of the checkout. Requires one of the following permissions: AUTHENTICATED_USER.
  """
  checkoutCustomerAttach(
    """The checkout's ID."""
    id: ID!
  ): CheckoutCustomerAttach

  """
  Removes the user assigned as the owner of the checkout. Requires one of the following permissions: AUTHENTICATED_USER.
  """
  checkoutCustomerDetach(
    """The checkout's ID."""
    id: ID!
  ): CheckoutCustomerDetach

  """Updates the delivery method (shipping method) of the checkout."""
  checkoutDeliveryMethodUpdate(
    """Delivery Method ID (`ShippingMethod`)."""
    deliveryMethodId: ID

    """The checkout's ID."""
    id: ID!
  ): CheckoutDeliveryMethodUpdate

  """Updates email address in the existing checkout object."""
  checkoutEmailUpdate(
    """email."""
    email: String!

    """The checkout's ID."""
    id: ID!
  ): CheckoutEmailUpdate

  """
  Adds a checkout line to the existing checkout.If line was already in checkout, its quantity will be increased.
  """
  checkoutLinesAdd(
    """The checkout's ID."""
    id: ID!

    """
    A list of checkout lines, each containing information about an item in the checkout.
    """
    lines: [CheckoutLineInput!]!
  ): CheckoutLinesAdd

  """Deletes checkout lines."""
  checkoutLinesDelete(
    """The checkout's ID."""
    id: ID!

    """A list of checkout lines."""
    linesIds: [ID!]!
  ): CheckoutLinesDelete

  """Updates checkout line in the existing checkout."""
  checkoutLinesUpdate(
    """The checkout's ID."""
    id: ID!

    """
    A list of checkout lines, each containing information about an item in the checkout.
    """
    lines: [CheckoutLineUpdateInput!]!
  ): CheckoutLinesUpdate

  """Update shipping address in the existing checkout."""
  checkoutShippingAddressUpdate(
    """The checkout's ID."""
    id: ID!

    """The mailing address to where the checkout will be shipped."""
    shippingAddress: AddressInput!
  ): CheckoutShippingAddressUpdate

  """End the current session. Succeeds when there is none."""
  logout: Logout!

  """
  Cancel an order.
  
  Requires one of the following permissions: MANAGE_ORDERS.
  """
  orderCancel(
    """ID of the order to cancel."""
    id: ID!
  ): OrderCancel

  """
  Creates new fulfillments for an order.
  
  Requires one of the following permissions: MANAGE_ORDERS.
  """
  orderFulfill(
    """Fields required to create a fulfillment."""
    input: OrderFulfillInput!

    """ID of the order to be fulfilled."""
    order: ID
  ): OrderFulfill

  """
  Mark order as manually paid.
  
  Requires one of the following permissions: MANAGE_ORDERS.
  """
  orderMarkAsPaid(
    """ID of the order to mark paid."""
    id: ID!

    """The external transaction reference."""
    transactionReference: String
  ): OrderMarkAsPaid

  """
  Create new permission group. Requires one of the following permissions: MANAGE_STAFF.
  """
  permissionGroupCreate(
    """Input fields to create permission group."""
    input: PermissionGroupCreateInput!
  ): PermissionGroupCreate!

  """
  Update permission group. Requires one of the following permissions: MANAGE_STAFF.
  """
  permissionGroupUpdate(
    """ID of the group to update."""
    id: ID!

    """Input fields to create permission group."""
    input: PermissionGroupUpdateInput!
  ): PermissionGroupUpdate!

  """
  Deletes products.
  
  Requires one of the following permissions: MANAGE_PRODUCTS.
  """
  productBulkDelete(
    """List of product IDs to delete."""
    ids: [ID!]!
  ): ProductBulkDelete

  """
  Creates a new product.
  
  Requires one of the following permissions: MANAGE_PRODUCTS.
  """
  productCreate(
    """Fields required to create a product."""
    input: ProductCreateInput!
  ): ProductCreate!

  """
  Deletes a product.
  
  Requires one of the following permissions: MANAGE_PRODUCTS.
  """
  productDelete(
    """ID of a product to delete."""
    id: ID!
  ): ProductDelete!

  """
  Create a media object (image or video URL) associated with product. For image, this mutation must be sent as a `multipart` request. More detailed specs of the upload format can be found here: https://github.com/jaydenseric/graphql-multipart-request-spec
  
  Requires one of the following permissions: MANAGE_PRODUCTS.
  """
  productMediaCreate(
    """Fields required to create a product media."""
    input: ProductMediaCreateInput!
  ): ProductMediaCreate!

  """
  Deletes a product media.
  
  Requires one of the following permissions: MANAGE_PRODUCTS.
  """
  productMediaDelete(
    """ID of a product media to delete."""
    id: ID!
  ): ProductMediaDelete!

  """
  Changes ordering of the product media.
  
  Requires one of the following permissions: MANAGE_PRODUCTS.
  """
  productMediaReorder(
    """IDs of a product media in the desired order."""
    mediaIds: [ID!]!

    """ID of product that media order will be altered."""
    productId: ID!
  ): ProductMediaReorder!

  """
  Updates a product media.
  
  Requires one of the following permissions: MANAGE_PRODUCTS.
  """
  productMediaUpdate(
    """ID of a product media to update."""
    id: ID!

    """Fields required to update a product media."""
    input: ProductMediaUpdateInput!
  ): ProductMediaUpdate!

  """
  Updates an existing product.
  
  Requires one of the following permissions: MANAGE_PRODUCTS.
  """
  productUpdate(
    """ID of a product to update."""
    id: ID!

    """Fields required to update a product."""
    input: ProductInput!
  ): ProductUpdate!

  """
  Creates a new variant for a product.
  
  Requires one of the following permissions: MANAGE_PRODUCTS.
  """
  productVariantCreate(
    """Fields required to create a product variant."""
    input: ProductVariantCreateInput!
  ): ProductVariantCreate!

  """
  Deletes a product variant.
  
  Requires one of the following permissions: MANAGE_PRODUCTS.
  """
  productVariantDelete(
    """ID of a product variant to delete."""
    id: ID!
  ): ProductVariantDelete!


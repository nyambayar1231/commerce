packages:
  - "apps/*"
  - "packages/*"
  # Playwright golden paths (PLAN M9.7): drive the dashboard and the API end to end.
  - "e2e"
  # The AWS infrastructure as a CDK app (PLAN M10.5).
  - "infra/aws"

# pnpm blocks dependency install scripts by default. esbuild (used by drizzle-kit) needs its
# script to install the native binary for this platform. next-intl (storefront) brings @swc/core and
# @parcel/watcher for its message extractor, which we don't use; both ship prebuilt binaries as
# optional dependencies, so their scripts stay blocked.
allowBuilds:
  "@parcel/watcher": false
  "@swc/core": false
  esbuild: true

# packages/db lists `pg` and `@opentelemetry/api` as devDependencies only so that its drizzle-orm
# resolves the same optional peers as apps/api's (which gets them through pg-boss, PLAN M8.1).
# Otherwise pnpm installs two drizzle-orm variants whose types don't mix (`eq(column, …)` with a
# column from @commerce/db stops typechecking). Keep their versions equal to pg-boss's.

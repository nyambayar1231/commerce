# Local infrastructure only. Apps run on the host (see ARCHITECTURE.md §11).
name: commerce

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: commerce
      POSTGRES_PASSWORD: commerce
      POSTGRES_DB: commerce
    ports:
      - "5433:5432"
    volumes:
      # Postgres 18 images keep data in a versioned subdirectory
      # (/var/lib/postgresql/18/docker), so the volume mounts the parent directory.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commerce -d commerce"]
      interval: 2s
      timeout: 3s
      retries: 15

  # S3-compatible object storage for product media in dev and tests (ADR-0014); production uses
  # AWS S3. MinIO stopped publishing images in 2025, so SeaweedFS's S3 gateway stands in.
  # Credentials and the anonymous read access are dev-only (infra/seaweedfs/s3.json).
  s3:
    image: chrislusf/seaweedfs:4.51
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -ip.bind=0.0.0.0
    ports:
      - "8333:8333"
    volumes:
      - s3-data:/data
      - ./infra/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/healthz || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Catches every email the worker sends in dev (PLAN M8): SMTP on 1026, the web UI and its API on
  # http://localhost:8026. Nothing leaves the machine. Not Mailpit's default 1025/8025, which the
  # reference saleor-platform stack already uses on this machine.
  mailpit:
    image: axllent/mailpit:v1.32.0
    ports:
      - "1026:1025"
      - "8026:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres-data:
  s3-data:

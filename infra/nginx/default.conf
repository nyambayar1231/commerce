# The `web` image (PLAN M9.6): serves the dashboard and proxies the API on the same origin, so the
# browser needs no CORS and the session cookie is first-party. The API trusts the X-Forwarded-For
# entry this proxy adds (TRUST_PROXY=true): $proxy_add_x_forwarded_for appends the client's
# address to whatever the client sent, and the API reads only that last entry.
server {
    listen 80;
    server_name _;
    server_tokens off;

    # Product image uploads are capped at 10 MiB by the API (Yoga's body limit is 11 MiB).
    client_max_body_size 11m;

    location = /graphql {
        proxy_pass http://api:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /thumbnail/ {
        proxy_pass http://api:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # The media bucket, when it lives in the stack's own S3 server (docker-compose.prod.yml's
    # local-services profile). With AWS S3 or a CDN, MEDIA_PUBLIC_URL points there instead and this
    # block is unused. The upstream is a variable, so nginx resolves `s3` per request (Docker's
    # DNS) instead of at startup, and starts without that service (PLAN M10.2); a variable
    # proxy_pass doesn't strip the /media/ prefix, so the rewrite does.
    location /media/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $media_upstream http://s3:8333;
        rewrite ^/media/(.*)$ /$1 break;
        proxy_pass $media_upstream;
        limit_except GET HEAD { deny all; }
    }

    # The dashboard: a single-page app, so unknown paths get index.html (React Router routes them).
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }

    # Hashed build assets never change; index.html must always be revalidated.
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
    }
}
